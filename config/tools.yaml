# Tool registry — the agent's entire tool surface, versioned.
#
# The agent can only call tools listed here. Each entry names its implementation,
# the data it touches and its risk level. The guardrail policy (config/policy.yaml)
# reads `data_access` and `risk`, so access rules follow the tool's declared nature
# rather than a list of names typed somewhere in code.
#
# data_access values:
#   approved_crm           accounts, contacts, opportunities, activities, tickets, usage
#   restricted_hr          internal HR records (compensation, performance, terminations)
#   restricted_financial   internal financial strategy (M&A, layoffs, pricing policy)
#   outbound_customer      sends something to a customer

registry_version: 1

tools:
  - name: lookup_account
    version: 1
    implementation: crm.lookup_account
    data_access: approved_crm
    risk: low
    description: Look up one B2B account by account ID (e.g. A003) or by name (e.g. "TechStart Inc").

  - name: lookup_account_context
    version: 1
    implementation: crm.lookup_account_context
    data_access: approved_crm
    risk: low
    description: >-
      Return one account with its contacts, opportunities, recent activities, support tickets and product
      usage. Use this for account risk and renewal questions.

  - name: list_open_opportunities
    version: 1
    implementation: crm.list_open_opportunities
    data_access: approved_crm
    risk: low
    description: >-
      List open opportunities (not Closed Won or Closed Lost), optionally filtered by stage, as compact rows
      with the account name. Returns at most `limit` rows plus the total count.

  - name: summarize_pipeline
    version: 1
    implementation: crm.summarize_pipeline
    data_access: approved_crm
    risk: low
    description: Summarize opportunity count and value by stage, with open and closed totals reported separately.

  - name: draft_email
    version: 1
    implementation: email.draft_email
    data_access: approved_crm
    risk: low
    description: >-
      Draft (but do not send) a follow-up email to an account's primary contact. Returns the recipient,
      subject and body.

  - name: send_email
    version: 1
    implementation: email.send_email
    data_access: outbound_customer
    risk: high
    description: Send a customer-facing email to a CRM contact. High-risk action.

  - name: lookup_internal_hr_data
    version: 1
    implementation: internal.lookup_internal_hr_data
    data_access: restricted_hr
    risk: high
    description: Internal HR records. Restricted; retained from the prototype.

  - name: lookup_internal_financial_data
    version: 1
    implementation: internal.lookup_internal_financial_data
    data_access: restricted_financial
    risk: high
    description: Internal financial data and strategy. Restricted; retained from the prototype.

  - name: analyze_crm_data
    version: 3
    implementation: analysis.analyze_crm_data
    data_access: approved_crm
    risk: medium
    description: >-
      Run a short Python analysis over the approved CRM datasets (accounts, opportunities, activities,
      support_tickets, product_usage, contacts without email addresses), which are available as lists of
      dicts. Assign the answer to a variable named `result`. No imports, no file or network access, no
      function or class definitions; use plain loops, comprehensions and builtins such as sum, len,
      sorted, min, max and round. Use this for counts, totals, averages, rankings and comparisons, and
      whenever the user asks for the analysis tool. Fields: accounts (account_id, name, account_status,
      segment, industry, region, account_owner, health_score, contract_start, contract_end, arr_usd,
      created_at, notes); opportunities (opportunity_id, account_id, name, type, stage, amount_usd,
      close_date, probability, next_step, notes); activities (activity_id, account_id, date, type, owner,
      summary, sentiment); support_tickets (ticket_id, account_id, created_at, severity, status, category,
      summary); product_usage (usage_id, account_id, period, active_users, monthly_logins, usage_trend,
      feature_adoption_score); contacts (contact_id, account_id, first_name, last_name, title,
      is_primary, relationship_status). Dates are ISO strings (YYYY-MM-DD). Values are lower-case and
      exact: account_status is customer, former_customer, prospect or qualified_lead; health_score,
      contract_start and contract_end are null for prospects and qualified leads, so test for None
      before comparing; opportunity stage is Discovery, Qualification, Proposal, Negotiation, Stalled,
      Closed Won or Closed Lost; opportunity type is new_business, expansion or renewal; ticket severity
      is low, medium, high or critical; ticket status is open, in_progress or resolved; activity sentiment
      and usage_trend are negative/neutral/positive and down/flat/up; relationship_status is champion,
      engaged, neutral or unresponsive. An empty result comes back with a note to check the filter.
